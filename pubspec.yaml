name: auditchain
description: AuditChain - Sistema de Auditoría para Franquicias
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP & networking
  http: ^1.2.0
  dio: ^5.4.3
  dio_cache_interceptor: ^3.5.0
  # State management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Storage
  shared_preferences: ^2.3.0
  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  # Routing & UI
  go_router: ^14.2.7
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
